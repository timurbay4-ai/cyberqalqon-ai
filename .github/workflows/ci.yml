# ============================================================
# CyberQalqon AI — CI Workflow
# ============================================================
# Runs backend tests and validates shared JSON syntax.

name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: |
          cd backend
          pip check

      - name: Compile backend sources
        run: |
          cd backend
          python -m compileall -q app tests

      - name: Run backend tests
        run: |
          cd backend
          pytest -q

  wazuh-sender-tests:
    name: Wazuh Sender Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sender and E2E dependencies
        run: |
          pip install -r tests/requirements-e2e.txt
          pip install -e wazuh

      - name: Check installed dependencies
        run: pip check

      - name: Compile sender and E2E sources
        run: python -m compileall -q wazuh/cyberqalqon_sender wazuh/tests tests/e2e

      - name: Run sender unit tests
        run: pytest -q wazuh/tests

      - name: Run live HTTP delivery E2E
        run: pytest -q tests/e2e/test_wazuh_sender_delivery.py

  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate JSON syntax
        run: |
          for f in $(find shared/ -name "*.json"); do
            echo "Validating $f"
            python3 -m json.tool "$f" > /dev/null && echo "  OK: $f"
          done
