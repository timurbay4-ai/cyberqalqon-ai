# ============================================================
# CyberQalqon AI вЂ” CI Workflow
# ============================================================
# Runs backend tests and validates shared JSON syntax.

name: CI

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck frontend
        run: npm run typecheck
        working-directory: frontend

      - name: Test frontend
        run: npm test
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high
        working-directory: frontend

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up collector toolchain for real TCP integration
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install -r requirements-build.txt
          pip install -r requirements-dev.txt
          pip install -e ../wazuh

      - name: Check installed dependencies
        run: |
          cd backend
          pip check

      - name: Compile backend sources
        run: |
          cd backend
          python -m compileall -q app tests

      - name: Run backend tests
        run: python -m pytest -q backend/tests

      - name: Run isolated full SOC release demo
        run: python -m app.cli.rc_demo --output m33-isolated-demo.json

      - name: Run fake-Ollama real HTTP E2E
        run: pytest -q tests/e2e/test_ai_analyst.py

  wazuh-sender-tests:
    name: Wazuh Sender Tests
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/backend:${{ github.workspace }}/scripts

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install sender and E2E dependencies
        run: |
          pip install -r tests/requirements-e2e.txt
          pip install -e wazuh

      - name: Check installed dependencies
        run: pip check

      - name: Compile sender and E2E sources
        run: python -m compileall -q wazuh/cyberqalqon_sender wazuh/tests tests/e2e

      - name: Run sender unit tests
        run: pytest -q wazuh/tests

      - name: Run complete root regression (including source-review gates)
        run: python -m pytest -q tests

      - name: Run live HTTP delivery E2E
        run: pytest -q tests/e2e/test_wazuh_sender_delivery.py

  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate JSON syntax
        run: |
          mkdir -p artifacts/runtime/m36-ci
          python3 -m scripts.source_release --output artifacts/runtime/m36-ci/source-manifest.json --materialize artifacts/runtime/m36-ci/source
      - name: Reject tracked private or runtime artifacts from the exact Git tree
        run: |
          python3 -c "import json,sys; m=json.load(open('artifacts/runtime/m36-ci/source-manifest.json')); blocked=[r['path'] for r in m['excluded']]; print(json.dumps({'forbidden_git_paths':blocked})); sys.exit(1 if blocked else 0)"

      - name: Verify the complete approved source tree and content hashes
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          from scripts.source_release import validate_manifest, digest
          identity = 'docs/release/PUBLICATION_SOURCE_MANIFEST.json'
          manifest = json.loads(Path(identity).read_text(encoding='utf-8'))
          validate_manifest(manifest)
          expected = {row['path'] for row in manifest['files']} | {identity}
          actual = set(filter(None, subprocess.check_output(['git','ls-files','-z']).decode('utf-8').split('\0')))
          missing = sorted(expected - actual)
          unexpected = sorted(actual - expected)
          changed = [row['path'] for row in manifest['files'] if not Path(row['path']).is_file() or digest(Path(row['path'])) != row['sha256']]
          print(json.dumps({'missing_paths':missing,'unexpected_paths':unexpected,'changed_paths':changed}))
          sys.exit(1 if missing or unexpected or changed else 0)
          PY

  go-collector:
    name: Go collector tests and race detector (synthetic only)
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOPROXY: 'off'
      GOMAXPROCS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false
      - name: Formatting, vet and ordinary build
        run: |
          test -z "$(gofmt -l collector)"
          go -C collector vet ./...
          go -C collector test -count=1 -p 1 ./...
          mkdir -p artifacts/runtime/m36-ci
          CGO_ENABLED=0 go -C collector build -trimpath -buildvcs=false -o ../artifacts/runtime/m36-ci/cq-collector ./cmd/cq-collector
          artifacts/runtime/m36-ci/cq-collector --help
      - name: Real race instrumentation
        env:
          CGO_ENABLED: '1'
          GORACE: 'halt_on_error=1 exitcode=66'
        run: go -C collector test -race -count=1 -p 1 ./...

  go-collector-windows-race:
    name: Windows Go race (checksum-pinned portable compiler)
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      GOPROXY: 'off'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GORACE: 'halt_on_error=1 exitcode=66'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.0"
          cache: false
      - name: Verify portable compiler before unpacking or execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compilerRoot = Join-Path $env:RUNNER_TEMP 'cq-m36-verified-compiler'
          $archivePath = Join-Path $env:RUNNER_TEMP 'cq-m36-compiler.zip'
          if ((Test-Path $compilerRoot) -or (Test-Path $archivePath)) { throw 'New compiler paths required' }
          Invoke-WebRequest 'https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip' -OutFile $archivePath
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne '3c69305081e4a647144339a936244fcf7d3d9e558319e1ad7be2cd2886d4b6a1') { throw 'Compiler archive checksum mismatch' }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $compilerRoot
          $gcc = Join-Path $compilerRoot 'mingw64/bin/gcc.exe'
          if ((Get-FileHash -LiteralPath $gcc -Algorithm SHA256).Hash.ToLowerInvariant() -ne '7e7ed95e0333c76afa593cbb732a4f22c37a9420b091a66b0ebb27077bf3a9b4') { throw 'Compiler executable checksum mismatch' }
          if ((& $gcc -dumpmachine).Trim() -ne 'x86_64-w64-mingw32') { throw 'Compiler target mismatch' }
          "CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          (Split-Path -Parent $gcc) | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Test the actual collector with race instrumentation
        run: go -C collector test -race -count=1 -p 1 ./...

  security-review:
    name: Release security gates (no suppression of findings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Prepare isolated audit target and tools
        run: |
          python -m pip install -r backend/requirements-build.txt
          python -m pip install -r tests/requirements-e2e.txt -e wazuh
          python -m venv artifacts/runtime/m33-ci-tools
          artifacts/runtime/m33-ci-tools/bin/python -m pip install -r tests/requirements-security.txt
          mkdir -p artifacts/runtime/m33-ci
          python scripts/release_inventory.py --output artifacts/runtime/m33-ci/inventory.json --resolved-requirements artifacts/runtime/m33-ci/requirements.txt
      - name: Dependency vulnerability gate
        run: artifacts/runtime/m33-ci-tools/bin/python -m pip_audit --disable-pip --no-deps -r artifacts/runtime/m33-ci/requirements.txt --format json --output artifacts/runtime/m33-ci/dependencies.json
      - name: SBOM (actual audit target, not the scanner venv)
        if: always()
        run: artifacts/runtime/m33-ci-tools/bin/python -m pip_audit --disable-pip --no-deps -r artifacts/runtime/m33-ci/requirements.txt --format cyclonedx-json --output artifacts/runtime/m33-ci/sbom.json
      - name: Static security gate (medium severity and confidence or higher)
        if: always()
        run: artifacts/runtime/m33-ci-tools/bin/python -m bandit -r backend/app wazuh/cyberqalqon_sender -ll -ii -f json -o artifacts/runtime/m33-ci/bandit.json
      - name: Retain security evidence even on a failed gate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m33-security-evidence
          path: artifacts/runtime/m33-ci/

  deployment-checks:
    name: Production Deployment Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install deployment test dependencies
        run: |
          python -m pip install -r tests/requirements-e2e.txt
          python -m pip install -e wazuh

      - name: Check installed dependencies
        run: python -m pip check

      - name: Validate rendered deployment contract
        run: python -m pytest -q tests/deployment

      - name: Prepare synthetic deployment inputs
        run: |
          mkdir -p .qa/secrets .qa/backups
          smoke_ingest_key="$(openssl rand -hex 32)"
          smoke_password="Qa9!$(openssl rand -hex 24)"
          echo "::add-mask::$smoke_ingest_key"
          echo "::add-mask::$smoke_password"
          printf '%s\n' "$smoke_ingest_key" > .qa/secrets/wazuh-ingest-api-key
          printf 'CYBERQALQON_SMOKE_INGEST_KEY=%s\n' "$smoke_ingest_key" >> "$GITHUB_ENV"
          printf 'CYBERQALQON_SMOKE_PASSWORD=%s\n' "$smoke_password" >> "$GITHUB_ENV"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout .qa/secrets/tls.key -out .qa/secrets/tls.crt \
            -subj '/CN=localhost' -addext 'subjectAltName=DNS:localhost'
          chmod 400 .qa/secrets/wazuh-ingest-api-key .qa/secrets/tls.key
          chmod 444 .qa/secrets/tls.crt
          sudo chown 10001:10001 .qa/secrets/wazuh-ingest-api-key
          sudo chown 101:101 .qa/secrets/tls.crt .qa/secrets/tls.key

      - name: Build production images
        env:
          CYBERQALQON_ORIGIN: https://localhost:18443
          HTTP_PORT: "18080"
          HTTPS_PORT: "18443"
          WAZUH_INGEST_API_KEY_FILE: ./.qa/secrets/wazuh-ingest-api-key
          TLS_CERT_PATH: ./.qa/secrets/tls.crt
          TLS_KEY_PATH: ./.qa/secrets/tls.key
          BACKUP_DIR: ./.qa/backups
          APP_GIT_COMMIT: ${{ github.sha }}
          APP_BUILD_TIMESTAMP: ci-build
        run: docker compose --env-file .env.production.example build backend web

      - name: Inspect images and Nginx configuration
        run: |
          test "$(docker image inspect cyberqalqon/backend:0.9.0 --format '{{.Config.User}}')" = '10001:10001'
          test "$(docker image inspect cyberqalqon/web:0.9.0 --format '{{.Config.User}}')" = '101:101'
          test -z "$(docker image inspect cyberqalqon/backend:0.9.0 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -F "$CYBERQALQON_SMOKE_INGEST_KEY" || true)"
          test -z "$(docker image inspect cyberqalqon/backend:0.9.0 --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -E 'WAZUH_INGEST_API_KEY=' || true)"
          test -z "$(docker history --no-trunc cyberqalqon/backend:0.9.0 | grep -F "$CYBERQALQON_SMOKE_INGEST_KEY" || true)"
          docker run --rm --entrypoint sh cyberqalqon/backend:0.9.0 -c \
            'test -z "$(find /opt/cyberqalqon -type f \( -name ".env" -o -name "*.db" -o -name "*.sqlite*" -o -name "*.key" -o -name "*.pem" \) -print -quit)"'
          docker run --rm --entrypoint sh cyberqalqon/web:0.9.0 -c \
            'test -z "$(find /usr/share/nginx/html -type f \( -name ".env" -o -name "*.db" -o -name "*.sqlite*" -o -name "*.key" -o -name "*.pem" \) -print -quit)"'
          docker run --rm --entrypoint nginx \
            -v "$PWD/.qa/secrets:/etc/nginx/tls:ro" \
            cyberqalqon/web:0.9.0 -t

      - name: Run isolated HTTPS Compose smoke test
        env:
          CYBERQALQON_ORIGIN: https://localhost:18443
          HTTP_PORT: "18080"
          HTTPS_PORT: "18443"
          WAZUH_INGEST_API_KEY_FILE: ./.qa/secrets/wazuh-ingest-api-key
          TLS_CERT_PATH: ./.qa/secrets/tls.crt
          TLS_KEY_PATH: ./.qa/secrets/tls.key
          BACKUP_DIR: ./.qa/backups
          CYBERQALQON_SMOKE_URL: https://localhost:18443
          CYBERQALQON_SMOKE_ORIGIN: https://localhost:18443
          CYBERQALQON_SMOKE_USERNAME: ci-admin
          CYBERQALQON_SMOKE_ALLOW_SELF_SIGNED: "true"
        run: |
          set -euo pipefail
          cleanup() {
            docker compose --env-file .env.production.example logs --no-color || true
            docker compose --env-file .env.production.example down --volumes --remove-orphans || true
            rm -rf .qa
          }
          trap cleanup EXIT
          docker compose --env-file .env.production.example up -d backend web
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --insecure https://localhost:18443/readiness >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then exit 1; fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:18080/)" = '308'
          printf '%s\n' "$CYBERQALQON_SMOKE_PASSWORD" | docker compose --env-file .env.production.example exec -T backend \
            python -m app.cli.bootstrap_analyst --username "$CYBERQALQON_SMOKE_USERNAME" \
            --display-name 'CI Administrator' --password-stdin
          python scripts/compose_smoke.py
