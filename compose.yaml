name: cyberqalqon

services:
  backend:
    image: ${BACKEND_IMAGE:-cyberqalqon/backend:0.8.1}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        APP_GIT_COMMIT: ${APP_GIT_COMMIT:-unknown}
        APP_BUILD_TIMESTAMP: ${APP_BUILD_TIMESTAMP:-unknown}
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:////var/lib/cyberqalqon/cyberqalqon.db
      CORS_ORIGINS: ${CYBERQALQON_ORIGIN:?Set CYBERQALQON_ORIGIN to the exact HTTPS browser origin}
      WAZUH_INGEST_API_KEY_FILE: /run/secrets/wazuh_ingest_api_key
      MAX_INGEST_BYTES: "1048576"
      ANALYST_SESSION_TTL_SECONDS: ${ANALYST_SESSION_TTL_SECONDS:-28800}
      SESSION_COOKIE_SECURE: "true"
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
      LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_ALLOW_PRIVATE_NETWORK: ${OLLAMA_ALLOW_PRIVATE_NETWORK:-true}
      OLLAMA_ALLOWED_HOSTS: ${OLLAMA_ALLOWED_HOSTS:-ollama}
      OLLAMA_CONNECT_TIMEOUT_SECONDS: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:-3}
      OLLAMA_REQUEST_TIMEOUT_SECONDS: ${OLLAMA_REQUEST_TIMEOUT_SECONDS:-90}
      AI_MAX_CONCURRENT_REQUESTS: ${AI_MAX_CONCURRENT_REQUESTS:-1}
      AI_USER_COOLDOWN_SECONDS: ${AI_USER_COOLDOWN_SECONDS:-2}
    secrets:
      - source: wazuh_ingest_api_key
        target: wazuh_ingest_api_key
        uid: "10001"
        gid: "10001"
        mode: 0400
    volumes:
      - backend-data:/var/lib/cyberqalqon
      - type: bind
        source: ${BACKUP_DIR:-./backups}
        target: /var/backups/cyberqalqon
    expose:
      - "8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readiness', timeout=2).read()"]
      interval: 15s
      timeout: 3s
      start_period: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}

  web:
    image: ${WEB_IMAGE:-cyberqalqon/web:0.8.1}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:8080"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:8443"
    volumes:
      - type: bind
        source: ${TLS_CERT_PATH:?Set TLS_CERT_PATH to a PEM certificate}
        target: /etc/nginx/tls/tls.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_PATH:?Set TLS_KEY_PATH to its private key}
        target: /etc/nginx/tls/tls.key
        read_only: true
    networks:
      - edge
      - private
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}

  ollama:
    profiles: ["ollama"]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.34.0}
    volumes:
      - ollama-models:/root/.ollama
    expose:
      - "11434"
    networks:
      - private
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-5}

networks:
  edge:
  private:
    internal: true

volumes:
  backend-data:
  ollama-models:

secrets:
  wazuh_ingest_api_key:
    file: ${WAZUH_INGEST_API_KEY_FILE:?Set WAZUH_INGEST_API_KEY_FILE to a protected key file}
